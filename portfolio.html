<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Barlan Maral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500&family=Gothic+A1:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ============================
     DESIGN TOKENS (shared with index.html / about.html)
     ============================ */
  :root{
    /* Colors */
    --color-bg: #1a1a1a;
    --color-surface: #333333;
    --color-surface-translucent: rgba(51, 51, 51, 0.8);
    --color-surface-translucent-light: rgba(51, 51, 51, 0.6);
    --color-button-bg: #3b3a3a;
    --color-white: #ffffff;
    --color-muted: #b7b7b7;
    --color-border-top: rgba(122, 122, 122, 0.15);

    /* Typography */
    --font-display: 'Abhaya Libre', Georgia, serif;
    --font-heading: 'Gothic A1', 'Segoe UI', sans-serif;
    --font-body: 'Century Gothic', 'Century Gothic MVB', 'Questrial', sans-serif;

    --fs-display-lg: 32px;
    --fs-display-md: 20px;
    --fs-heading: 16px;
    --fs-body: 12px;
    --fs-caption: 8px;

    --ls-tight: 2px;
    --ls-wide: 3px;
    --ls-widest: 4px;

    /* Spacing */
    --space-2xs: 4px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --space-2xl: 40px;

    /* Radius */
    --radius-md: 12px;
    --radius-xl: 18px;
    --radius-round: 100px;

    /* Shadow */
    --shadow-outer: 0px 0px 24px 0px rgba(180, 188, 203, 0.24);

    /* Layout */
    --page-max-width: 430px;
    --footer-height: 84px;
  }

  /* ============================
     ENTRANCE / SCROLL REVEAL ANIMATIONS
     ============================ */
  @keyframes fadeInUp{
    from{ opacity: 0; transform: translateY(18px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .navbar__brand{
    opacity: 0;
    animation: fadeInUp 0.9s ease forwards;
    animation-delay: 0.15s;
  }

  .reveal{
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .reveal.is-visible{
    opacity: 1;
    transform: translateY(0);
  }

  .gallery__item:nth-child(2){ transition-delay: 0.1s; }
  .gallery__item:nth-child(3){ transition-delay: 0.2s; }
  .gallery__item:nth-child(4){ transition-delay: 0.3s; }

  @media (prefers-reduced-motion: reduce){
    .navbar__brand{
      animation: none;
      opacity: 1;
    }

    .reveal{
      opacity: 1;
      transform: none;
      transition: none;
    }
  }

  /* ============================
     RESET
     ============================ */
  *, *::before, *::after{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html{
    -webkit-text-size-adjust: 100%;
  }

  body{
    background: #0d0d0d;
    color: var(--color-white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  img{
    display: block;
    max-width: 100%;
  }

  button{
    font-family: inherit;
    border: none;
    background: none;
    cursor: pointer;
    color: inherit;
  }

  a{
    color: inherit;
    text-decoration: none;
  }

  ul{
    list-style: none;
  }

  /* ============================
     PAGE SHELL
     ============================ */
  .page{
    position: relative;
    max-width: var(--page-max-width);
    min-height: 932px;
    margin: 0 auto;
    background: var(--color-bg);
    box-shadow: var(--shadow-outer);
    overflow: hidden;
    padding-bottom: var(--footer-height);
  }

  /* ============================
     NAVBAR
     ============================ */
  .navbar{
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 43px 16px 12px 25px;
  }

  .navbar__brand{
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
  }

  .navbar__title{
    font-family: var(--font-display);
    font-size: var(--fs-display-lg);
    line-height: 23px;
    letter-spacing: var(--ls-widest);
    color: var(--color-white);
    font-weight: 400;
  }

  .navbar__subtitle{
    font-family: var(--font-body);
    font-size: var(--fs-body);
    line-height: 13px;
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
    margin-top: 4px;
  }

  .navbar__toggle{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .navbar__toggle img{
    width: 20px;
    height: 20px;
  }

  .navbar__nav{
    position: absolute;
    top: 100%;
    right: 16px;
    left: 16px;
    background: var(--color-surface-translucent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-md);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.35s ease;
  }

  .navbar__nav.is-open{
    max-height: 320px;
    opacity: 1;
    padding: var(--space-sm) 0;
  }

  .navbar__list{
    display: flex;
    flex-direction: column;
  }

  .navbar__link{
    display: block;
    padding: var(--space-sm) var(--space-md);
    font-family: var(--font-body);
    font-size: var(--fs-body);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    color: var(--color-white);
  }

  .navbar__link:hover,
  .navbar__link:focus-visible{
    color: var(--color-muted);
  }

  .navbar__link.is-current{
    color: var(--color-muted);
  }

  @media (min-width: 1025px){
    .navbar__toggle{ display: none; }

    .navbar__nav{
      position: static;
      max-height: none;
      opacity: 1;
      overflow: visible;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 0;
      margin-top: 20px;
    }

    .navbar__list{
      flex-direction: row;
      gap: var(--space-lg);
    }

    .navbar__link{
      padding: var(--space-2xs) 0;
    }
  }

  /* ============================
     GALLERY
     ============================ */
  .gallery{
    padding: var(--space-lg) 25px 40px;
  }

  .gallery__grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    column-gap: 17px;
    row-gap: 38px;
  }

  .gallery__item{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-sm);
  }

  .gallery__link{
    display: block;
    width: 100%;
  }

  .gallery__link img{
    width: 100%;
    aspect-ratio: 161 / 181;
    object-fit: cover;
    border-radius: var(--radius-xl);
  }

  .gallery__caption{
    font-family: var(--font-body);
    font-size: var(--fs-body);
    line-height: 13px;
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
    text-align: center;
  }

  /* ============================
     FOOTER
     ============================ */
  .footer{
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    height: var(--footer-height);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-md);
    background: var(--color-surface-translucent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .footer__info{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex: 1 1 0%;
    min-width: 0;
  }

  .footer__name{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: var(--fs-display-md);
    line-height: 16px;
    letter-spacing: var(--ls-tight);
    color: var(--color-white);
    text-transform: capitalize;
  }

  .footer__label{
    font-family: var(--font-body);
    font-size: var(--fs-caption);
    line-height: 13px;
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
  }

  .footer__email{
    font-family: var(--font-body);
    font-size: var(--fs-caption);
    line-height: 13px;
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
    width: 100%;
    order: 3;
  }

  .footer__social{
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    order: 2;
  }

  .icon-btn{
    width: 22px;
    height: 22px;
    border-radius: var(--radius-round);
    background: var(--color-surface);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn svg{
    width: 12px;
    height: 12px;
    stroke: var(--color-white);
    fill: none;
  }

  /* ============================
     RESPONSIVE
     ============================ */
  @media (max-width: 768px){
    .page{
      max-width: 100%;
    }
  }

  @media (min-width: 1025px){
    .page{
      max-width: 430px;
    }
  }
</style>
</head>
<body>

<div class="page">

  <!-- NAVIGATION -->
  <header class="navbar">
    <div class="navbar__brand">
      <p class="navbar__title">Barlan Maral</p>
      <p class="navbar__subtitle">photographer</p>
    </div>

    <nav class="navbar__nav" id="navMenu">
      <ul class="navbar__list">
        <li><a class="navbar__link" href="index.html#top">Home</a></li>
        <li><a class="navbar__link" href="about.html">About me</a></li>
        <li><a class="navbar__link is-current" href="portfolio.html" aria-current="page">Portfolio</a></li>
        <li><a class="navbar__link" href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <button type="button" class="navbar__toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation menu">
      <img src="https://www.figma.com/api/mcp/asset/613180ba-2442-458d-9388-51b69ecf0855.svg" alt="">
    </button>
  </header>

  <main>

    <!-- GALLERY -->
    <section class="gallery" aria-label="Portfolio categories">
      <div class="gallery__grid">
        <div class="gallery__item reveal">
          <a class="gallery__link" href="brand-shoots.html">
            <img src="https://www.figma.com/api/mcp/asset/1f470976-6b54-4a06-968c-57587a16ecd0.png" alt="Brand shoots portfolio category">
          </a>
          <p class="gallery__caption">brand shoots</p>
        </div>
        <div class="gallery__item reveal">
          <a class="gallery__link" href="personal-shoots.html">
            <img src="https://www.figma.com/api/mcp/asset/ba533c8f-1943-42be-a6fa-b7cc35d60ea1.png" alt="Personal portfolio category">
          </a>
          <p class="gallery__caption">personal</p>
        </div>
        <div class="gallery__item reveal">
          <a class="gallery__link" href="vogue-photography.html">
            <img src="https://www.figma.com/api/mcp/asset/dafc4c87-99f6-4c40-ac85-7ac35215230a.png" alt="Vogue photography portfolio category">
          </a>
          <p class="gallery__caption">Vogue photography</p>
        </div>
        <div class="gallery__item reveal">
          <a class="gallery__link" href="model-tests.html">
            <img src="https://www.figma.com/api/mcp/asset/49a51ff3-7a47-44a2-be55-02cd54f5b10d.png" alt="Model tests and snaps portfolio category">
          </a>
          <p class="gallery__caption">model tests/snaps</p>
        </div>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__info">
      <p class="footer__name">Barlan Maral</p>
      <p class="footer__label">photographer</p>
    </div>

    <div class="footer__social">
      <a class="icon-btn" href="https://wa.me/77767772003" target="_blank" rel="noopener" aria-label="Message on WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </a>
      <a class="icon-btn" href="https://www.instagram.com/archifute" target="_blank" rel="noopener" aria-label="Follow on Instagram">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5" stroke="currentColor" stroke-width="2"/>
          <path d="M16 11.37a4 4 0 1 1-7.914 1.174A4 4 0 0 1 16 11.37z" stroke="currentColor" stroke-width="2"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </a>
    </div>

    <p class="footer__email">barlanakma@gmail.com</p>
  </footer>

</div>

<script>
  (function () {
    var toggle = document.getElementById('navToggle');
    var menu = document.getElementById('navMenu');

    if (!toggle || !menu) return;

    toggle.addEventListener('click', function () {
      var isOpen = menu.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    menu.querySelectorAll('.navbar__link').forEach(function (link) {
      link.addEventListener('click', function () {
        menu.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();

  (function () {
    var revealEls = document.querySelectorAll('.reveal');
    if (!revealEls.length) return;

    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion || !('IntersectionObserver' in window)) {
      revealEls.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

    revealEls.forEach(function (el) { observer.observe(el); });
  })();
</script>

</body>
</html>
