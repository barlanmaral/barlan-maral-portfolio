<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Shoots — Barlan Maral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500&family=Gothic+A1:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ============================
     DESIGN TOKENS (shared across pages)
     ============================ */
  :root{
    --color-bg: #1a1a1a;
    --color-surface: #333333;
    --color-surface-translucent: rgba(51, 51, 51, 0.8);
    --color-white: #ffffff;
    --color-muted: #b7b7b7;

    --font-display: 'Abhaya Libre', Georgia, serif;
    --font-heading: 'Gothic A1', 'Segoe UI', sans-serif;
    --font-body: 'Century Gothic', 'Century Gothic MVB', 'Questrial', sans-serif;

    --fs-display-lg: 32px;
    --fs-display-md: 20px;
    --fs-body: 12px;
    --fs-caption: 8px;

    --ls-tight: 2px;
    --ls-wide: 3px;
    --ls-widest: 4px;

    --space-2xs: 4px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;

    --radius-md: 12px;
    --radius-round: 100px;

    --shadow-outer: 0px 0px 24px 0px rgba(180, 188, 203, 0.24);

    --page-max-width: 430px;
    --footer-height: 84px;
  }

  /* ============================
     ENTRANCE / SCROLL REVEAL ANIMATIONS
     ============================ */
  @keyframes fadeInUp{
    from{ opacity: 0; transform: translateY(18px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .navbar__brand{
    opacity: 0;
    animation: fadeInUp 0.9s ease forwards;
    animation-delay: 0.15s;
  }

  .gallery-title{
    opacity: 0;
    animation: fadeInUp 0.9s ease forwards;
    animation-delay: 0.3s;
  }

  .reveal{
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .reveal.is-visible{
    opacity: 1;
    transform: translateY(0);
  }

  .gallery__figure:nth-child(2n){ transition-delay: 0.08s; }

  @media (prefers-reduced-motion: reduce){
    .navbar__brand,
    .gallery-title{
      animation: none;
      opacity: 1;
    }

    .reveal{
      opacity: 1;
      transform: none;
      transition: none;
    }
  }

  /* ============================
     RESET
     ============================ */
  *, *::before, *::after{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    background: #0d0d0d;
    color: var(--color-white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  img{ display: block; max-width: 100%; }

  button{
    font-family: inherit;
    border: none;
    background: none;
    cursor: pointer;
    color: inherit;
  }

  a{ color: inherit; text-decoration: none; }
  ul{ list-style: none; }

  /* ============================
     PAGE SHELL
     ============================ */
  .page{
    position: relative;
    max-width: var(--page-max-width);
    margin: 0 auto;
    background: var(--color-bg);
    box-shadow: var(--shadow-outer);
    overflow: hidden;
    padding-bottom: var(--footer-height);
  }

  /* ============================
     NAVBAR
     ============================ */
  .navbar{
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 43px 16px 12px 25px;
  }

  .navbar__brand{
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .navbar__title{
    font-family: var(--font-display);
    font-size: var(--fs-display-lg);
    line-height: 23px;
    letter-spacing: var(--ls-widest);
    color: var(--color-white);
    font-weight: 400;
  }

  .navbar__subtitle{
    font-family: var(--font-body);
    font-size: var(--fs-body);
    line-height: 13px;
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
    margin-top: 4px;
  }

  .navbar__toggle{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .navbar__toggle img{ width: 20px; height: 20px; }

  .navbar__nav{
    position: absolute;
    top: 100%;
    right: 16px;
    left: 16px;
    background: var(--color-surface-translucent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-md);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.35s ease;
  }

  .navbar__nav.is-open{
    max-height: 320px;
    opacity: 1;
    padding: var(--space-sm) 0;
  }

  .navbar__list{ display: flex; flex-direction: column; }

  .navbar__link{
    display: block;
    padding: var(--space-sm) var(--space-md);
    font-family: var(--font-body);
    font-size: var(--fs-body);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    color: var(--color-white);
  }

  .navbar__link:hover,
  .navbar__link:focus-visible{ color: var(--color-muted); }

  @media (min-width: 1025px){
    .navbar__toggle{ display: none; }

    .navbar__nav{
      position: static;
      max-height: none;
      opacity: 1;
      overflow: visible;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 0;
      margin-top: 20px;
    }

    .navbar__list{ flex-direction: row; gap: var(--space-lg); }
    .navbar__link{ padding: var(--space-2xs) 0; }
  }

  /* ============================
     GALLERY TITLE
     ============================ */
  .gallery-title{
    text-align: center;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 28px;
    line-height: 23px;
    letter-spacing: var(--ls-widest);
    color: var(--color-muted);
    padding: var(--space-xl) var(--space-lg) 0;
  }

  /* ============================
     GALLERY GRID
     ============================ */
  .gallery{
    padding: var(--space-xl) 25px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .gallery__row{
    display: grid;
    gap: 16px;
  }

  .gallery__row--split{
    grid-template-columns: 154fr 176fr;
  }

  .gallery__row--split-alt{
    grid-template-columns: 154fr 177fr;
  }

  .gallery__row--even{
    grid-template-columns: 169fr 168fr;
  }

  .gallery__row--full{
    grid-template-columns: 1fr;
  }

  .gallery__figure{
    cursor: pointer;
    overflow: hidden;
  }

  .gallery__figure img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .gallery__figure:hover img{
    transform: scale(1.03);
  }

  .gallery__row--split .gallery__figure:nth-child(1) img,
  .gallery__row--split-alt .gallery__figure:nth-child(1) img{ aspect-ratio: 154 / 230; }
  .gallery__row--split .gallery__figure:nth-child(2) img{ aspect-ratio: 176 / 230; }

  .gallery__row--full .gallery__figure img{ aspect-ratio: 346 / 231; }

  /* ============================
     FOOTER
     ============================ */
  .footer{
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    height: var(--footer-height);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-md);
    background: var(--color-surface-translucent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .footer__info{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex: 1 1 0%;
    min-width: 0;
  }

  .footer__name{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: var(--fs-display-md);
    line-height: 16px;
    letter-spacing: var(--ls-tight);
    color: var(--color-white);
    text-transform: capitalize;
  }

  .footer__label{
    font-family: var(--font-body);
    font-size: var(--fs-caption);
    line-height: 13px;
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
  }

  .footer__email{
    font-family: var(--font-body);
    font-size: var(--fs-caption);
    line-height: 13px;
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
    width: 100%;
    order: 3;
  }

  .footer__social{
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    order: 2;
  }

  .icon-btn{
    width: 22px;
    height: 22px;
    border-radius: var(--radius-round);
    background: var(--color-surface);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn svg{
    width: 12px;
    height: 12px;
    stroke: var(--color-white);
    fill: none;
  }

  /* ============================
     LIGHTBOX
     ============================ */
  .lightbox{
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(13, 13, 13, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease;
  }

  .lightbox.is-open{
    opacity: 1;
    visibility: visible;
  }

  .lightbox__stage{
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 56px;
    touch-action: pan-y;
  }

  .lightbox__img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 4px;
    opacity: 0;
    transform: scale(0.98);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .lightbox__img.is-visible{
    opacity: 1;
    transform: scale(1);
  }

  .lightbox__close,
  .lightbox__prev,
  .lightbox__next{
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: var(--radius-round);
    background: rgba(51, 51, 51, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: var(--color-white);
  }

  .lightbox__close svg,
  .lightbox__prev svg,
  .lightbox__next svg{
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
  }

  .lightbox__close{ top: 16px; right: 16px; }
  .lightbox__prev{ left: 12px; top: 50%; transform: translateY(-50%); }
  .lightbox__next{ right: 12px; top: 50%; transform: translateY(-50%); }

  .lightbox__counter{
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-body);
    font-size: var(--fs-body);
    letter-spacing: var(--ls-wide);
    color: var(--color-muted);
  }

  @media (max-width: 480px){
    .lightbox__stage{ padding: 48px 16px; }
    .lightbox__prev{ left: 6px; }
    .lightbox__next{ right: 6px; }
  }

  /* ============================
     RESPONSIVE
     ============================ */
  @media (max-width: 768px){
    .page{ max-width: 100%; }
  }

  @media (min-width: 1025px){
    .page{ max-width: 430px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- NAVIGATION -->

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lightbox__stage" id="lightboxStage">
    <img class="lightbox__img" id="lightboxImg" src="" alt="">

    <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Close photo viewer">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <button type="button" class="lightbox__prev" id="lightboxPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button type="button" class="lightbox__next" id="lightboxNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <p class="lightbox__counter" id="lightboxCounter"></p>
  </div>
</div>

<script>
  (function () {
    var toggle = document.getElementById('navToggle');
    var menu = document.getElementById('navMenu');

    if (!toggle || !menu) return;

    toggle.addEventListener('click', function () {
      var isOpen = menu.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    menu.querySelectorAll('.navbar__link').forEach(function (link) {
      link.addEventListener('click', function () {
        menu.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();

  (function () {
    var revealEls = document.querySelectorAll('.reveal');
    if (!revealEls.length) return;

    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion || !('IntersectionObserver' in window)) {
      revealEls.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

    revealEls.forEach(function (el) { observer.observe(el); });
  })();

  /* ============================
     LIGHTBOX / PHOTO VIEWER
     ============================ */
  (function () {
    var figures = Array.prototype.slice.call(document.querySelectorAll('.gallery__figure'));
    if (!figures.length) return;

    var photos = figures.map(function (fig) {
      var img = fig.querySelector('img');
      return { src: img.getAttribute('src'), alt: img.getAttribute('alt') };
    });

    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightboxImg');
    var lightboxCounter = document.getElementById('lightboxCounter');
    var closeBtn = document.getElementById('lightboxClose');
    var prevBtn = document.getElementById('lightboxPrev');
    var nextBtn = document.getElementById('lightboxNext');
    var stage = document.getElementById('lightboxStage');

    var currentIndex = 0;

    function showPhoto(index) {
      currentIndex = (index + photos.length) % photos.length;
      var photo = photos[currentIndex];
      lightboxImg.classList.remove('is-visible');
      window.setTimeout(function () {
        lightboxImg.setAttribute('src', photo.src);
        lightboxImg.setAttribute('alt', photo.alt);
        lightboxImg.classList.add('is-visible');
      }, 60);
      lightboxCounter.textContent = (currentIndex + 1) + ' / ' + photos.length;
    }

    function openLightbox(index) {
      showPhoto(index);
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    figures.forEach(function (fig, index) {
      fig.addEventListener('click', function () { openLightbox(index); });
      fig.setAttribute('tabindex', '0');
      fig.setAttribute('role', 'button');
      fig.setAttribute('aria-label', 'Open photo ' + (index + 1) + ' of ' + photos.length);
      fig.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(index);
        }
      });
    });

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', function () { showPhoto(currentIndex - 1); });
    nextBtn.addEventListener('click', function () { showPhoto(currentIndex + 1); });

    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', function (e) {
      if (!lightbox.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showPhoto(currentIndex + 1);
      if (e.key === 'ArrowLeft') showPhoto(currentIndex - 1);
    });

    /* Swipe support for touch devices */
    var touchStartX = null;

    stage.addEventListener('touchstart', function (e) {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    stage.addEventListener('touchend', function (e) {
      if (touchStartX === null) return;
      var deltaX = e.changedTouches[0].clientX - touchStartX;
      var threshold = 40;

      if (deltaX > threshold) {
        showPhoto(currentIndex - 1);
      } else if (deltaX < -threshold) {
        showPhoto(currentIndex + 1);
      }

      touchStartX = null;
    }, { passive: true });
  })();
</script>

</body>
